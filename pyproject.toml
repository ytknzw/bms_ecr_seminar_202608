[project]
name = "ecr-python-r-hands-on-2026"
version = "0.1.0"
description = "第2回ECR支援セミナー Python/Rによるデータ解析ハンズオン"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.2",
    "pandas==2.2.3",
    "plotly==6.0.1",
    "statsmodels==0.14.4",
    "scikit-learn==1.6.1",
    "lightgbm==4.6.0",
    "pymc==6.2.0",
    "nutpie[pymc]",  # 任意。入らない場合はこの行を削除して `uv sync`
    "arviz==1.2.0",
    "matplotlib==3.10.1",
    "openpyxl==3.1.5",
    "pytest==8.3.5",
    "pillow==11.1.0",
    "pyarrow>=25.0.0",
    "graphviz>=0.21",
    "arviz-plots>=1.2.0",
    "kaleido==0.2.1",
    "webcolors>=25.10.0",
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
]

[tool.uv]
package = false
